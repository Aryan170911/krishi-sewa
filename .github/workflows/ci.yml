name: CI - Krishi Sewa
on: [push, pull_request]
jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd server && npm ci
      - run: node --check server/server.js && node --check server/data.js
      - run: cd server && npm start &
             sleep 5 && curl -f http://localhost:3000/api/health
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python -m py_compile api.py
      - run: PORT=8001 python api.py & sleep 5 && curl -f http://localhost:8001/api/health
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t krishi:test .
