version: '3.8'
services:
  krishi:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=*
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
    volumes:
      - ./server/data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: Python alternative (uncomment to use Flask)
  # krishi-py:
  #   image: python:3.11-slim
  #   working_dir: /app
  #   volumes: [".:/app"]
  #   ports: ["8000:8000"]
  #   command: bash -c "pip install -r requirements.txt && PORT=8000 python api.py"
  #   environment: [PORT=8000]

  # Optional: Nginx reverse proxy (for domain + port 80)
  # nginx:
  #   image: nginx:alpine
  #   ports: ["80:80"]
  #   volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
  #   depends_on: [krishi]
