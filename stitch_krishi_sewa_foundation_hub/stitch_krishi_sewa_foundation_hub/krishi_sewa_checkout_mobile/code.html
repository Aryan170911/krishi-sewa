<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .soft-trough {
            background-color: theme('colors.surface-container-lowest');
            border: 1px solid theme('colors.outline-muted');
            border-radius: theme('borderRadius.DEFAULT');
            transition: all 0.2s ease;
        }
        .soft-trough:focus-within {
            border-color: theme('colors.primary-container');
            outline: none;
        }
        .soft-trough input, .soft-trough select {
            background: transparent;
            border: none;
            width: 100%;
            padding: 12px 16px;
        }
        .soft-trough input:focus, .soft-trough select:focus {
            outline: none;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md text-body-md pt-16">
<!-- TopAppBar -->
<header class="bg-surface text-primary font-headline-sm fixed top-0 w-full z-50 border-b border-outline-variant hover:bg-surface-variant/50 active:scale-95 transition-transform duration-150 flex items-center justify-between px-margin-mobile h-16 w-full max-w-full">
<button aria-label="Menu" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors">
<span aria-hidden="true" class="material-symbols-outlined text-primary">menu</span>
</button>
<span class="font-headline-md text-headline-md-mobile text-primary font-headline-xl">Krishi Sewa</span>
<button aria-label="Cart" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors">
<span aria-hidden="true" class="material-symbols-outlined text-primary">shopping_cart</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-grow px-margin-mobile py-section-gap-mobile flex flex-col gap-stack-lg max-w-md mx-auto w-full">
<div>
<h1 class="font-headline-lg text-headline-lg-mobile text-primary mb-2">Checkout</h1>
<p class="text-on-surface-variant font-body-sm text-body-sm">Complete your order securely.</p>
</div>
<form class="flex flex-col gap-stack-lg">
<!-- Contact Info Section -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-headline-sm text-headline-sm-mobile text-primary border-b border-outline-muted pb-2">Contact Information</h2>
<div class="soft-trough">
<input class="font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="Email Address" required="" type="email"/>
</div>
<div class="soft-trough">
<input class="font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="Phone Number" required="" type="tel"/>
</div>
</section>
<!-- Shipping Info Section -->
<section class="flex flex-col gap-stack-md">
<h2 class="font-headline-sm text-headline-sm-mobile text-primary border-b border-outline-muted pb-2">Shipping Details</h2>
<div class="grid grid-cols-2 gap-stack-sm">
<div class="soft-trough">
<input class="font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="First Name" required="" type="text"/>
</div>
<div class="soft-trough">
<input class="font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="Last Name" required="" type="text"/>
</div>
</div>
<div class="soft-trough">
<input class="font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="Address Line 1" required="" type="text"/>
</div>
<div class="soft-trough relative">
<select class="font-body-md text-body-md text-on-surface appearance-none pr-10 cursor-pointer" required="">
<option disabled="" hidden="" selected="" value="">State</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<div class="grid grid-cols-2 gap-stack-sm">
<div class="soft-trough relative">
<select class="font-body-md text-body-md text-on-surface appearance-none pr-10 cursor-pointer" required="">
<option disabled="" hidden="" selected="" value="">District</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
<div class="soft-trough">
<input class="font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="PIN Code" required="" type="text"/>
</div>
</div>
</section>
<!-- Order Summary Section -->
<section class="bg-surface-container rounded-lg p-stack-md flex flex-col gap-stack-sm border border-outline-muted mt-stack-md">
<h3 class="font-headline-sm text-headline-sm-mobile text-primary">Order Summary</h3>
<div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
<span>Subtotal</span>
<span>₹ 1,250.00</span>
</div>
<div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
<span>Shipping</span>
<span>₹ 50.00</span>
</div>
<div class="flex justify-between font-body-md text-body-md font-bold text-on-surface pt-2 border-t border-outline-variant mt-2">
<span>Total</span>
<span>₹ 1,300.00</span>
</div>
</section>
<button class="w-full bg-primary-container text-on-primary py-4 rounded-lg font-label-md text-label-md uppercase tracking-wider hover:bg-primary transition-colors mt-4" type="submit">
                Place Order
            </button>
</form>
</main>
<!-- Footer -->
<footer class="bg-surface-container text-on-surface-variant font-label-md w-full mt-auto border-t border-outline-variant opacity-90 hover:opacity-100 flex flex-col items-center gap-stack-md py-stack-lg px-margin-mobile text-center">
<div class="flex gap-4">
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-primary transition-colors" href="#">Contact Us</a>
</div>
<p class="font-headline-sm text-headline-sm text-primary">© 2024 Krishi Sewa Foundation. Supporting our farmers.</p>
</footer>
</body></html>
